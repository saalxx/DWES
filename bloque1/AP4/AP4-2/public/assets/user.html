<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Listado de user</title>
</head>
<body>
<table border="1">
    <tr>
        <th>Id</th>
        <th>Nombre</th>
        <th>Estado</th>
        <th>Operaciones Resultado</th>
    </tr>

    <?php foreach ($users as $user): ?>
    <tr>
        <td><?= htmlspecialchars($user->getId()) ?></td>
        <td><?= htmlspecialchars($user->getName()) ?></td>
        <td><?= $user->isEstado() ? "Activo" : "Desactivado" ?></td>

        <?php $operations = $user->getOperations(); ?>
        <?php if (!empty($operations)): ?>
        <td>
            <?php foreach ($operations as $operation): ?>
            <?= htmlspecialchars($operation->getResult()) ?><br>
            <?php endforeach; ?>
        </td>
        <?php else: ?>
        <td colspan="2">Sin operaciones</td>
        <?php endif; ?>
    </tr>
    <?php endforeach; ?>
</table>
</body>
</html>
