<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><?php echo $update ? 'Actualizar' : 'Nueva' ?> user</title>
</head>
<body>
<h1><?php echo $update ? 'Actualizar' : 'Nueva' ?> user</h1>
<nav>
    <a href="/">Inicio</a> |
    <a href="/list">Lista de user</a>
</nav>
<hr>
<form action="<?php echo $update ? '/user/update/' . $user->getId() : '/user/create' ?>" method="POST">
    <?php if($update): ?>
    <input type="hidden" name="id" value="<?php echo $user->getId() ?>">
    <?php endif; ?>

    <label for="username">:username</label><br>
    <input type="text" name="username" id="username"
           value="<?php echo $update ? htmlspecialchars($user->getUsername()) : '' ?>"
           required maxlength="255" size="100"><br><br>

    <label for="firstSubname">Descripción:</label><br>
    <textarea name="firstSubname" id="firstSubname" rows="3" cols="100" required><?php echo $update ? htmlspecialchars($user->getFirstSubname()) : '' ?></textarea><br><br>

    <label for="country">country</label><br>
    <input type="text" name="country" id="country"
           value="<?php echo $update ? htmlspecialchars($user->getCountry()) : '' ?>"
           required maxlength="255" size="100"><br><br>


    <label for="email">:email</label><br>
    <input type="text" name="email" id="email"
           value="<?php echo $update ? htmlspecialchars($user->getEmail()) : '' ?>"
           required maxlength="255" size="100"><br><br>


    <label for="name">:name</label><br>
    <input type="name" name="name" id="name"
           value="<?php echo $update ? htmlspecialchars($user->getName()) : '' ?>"
           required maxlength="255" size="100"><br><br>




    <button type="submit" name="submit" value="1"><?php echo $update ? 'Actualizar' : 'Crear' ?> user</button>
    <?php if(!$update): ?>
    <button type="reset">Limpiar</button>
    <?php endif; ?>
</form>
</body>
</html>
