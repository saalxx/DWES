        <td>
            <a href="/task/read/<?php echo $task->getId() ?>">Ver Detalle</a> |
            <a href="/task/update/<?php echo $task->getId() ?>">Actualizar</a> |
            <a href="/task/delete/<?php echo $task->getId() ?>">Eliminar</a>

    </tr>
